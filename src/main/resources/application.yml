spring:
  application:
    name: iron-oak-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iron_oak_db}
    username: ${DB_USERNAME:ironman}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway owns the schema - Hibernate only validates it matches, never generates it.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${GPT_MODEL}
          temperature: 0.4
          max-tokens: 1024
      embedding:
        options:
          model: ${EMBEDDING_MODEL}
          # text-embedding-3-large is 3072 natively; shortened to 1024 to match
          # document_chunk.embedding VECTOR(1024) in V1__init_schema.sql.
          dimensions: 1024

    # No Spring AI VectorStore bean: DocumentChunk is a plain JPA entity and
    # DocumentChunkRepository hand-writes the pgvector <=> cosine query.

  security:
    filter:
      order: 10

server:
  port: ${SERVER_PORT:8080}

# CORS - Next.js frontend on Vercel
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-minutes: 120

  vision:
    model-path: ${VISION_MODEL_PATH:classpath:models/hardware_store_mobilenetv3.onnx}
    confidence-threshold: ${VISION_CONFIDENCE_THRESHOLD:0.55}
    input-size: 224

  rag:
    top-k: ${RAG_TOP_K:5}
    # Cosine similarity floor, applied after the top-k so the HNSW index still applies.
    min-similarity: ${RAG_MIN_SIMILARITY:0.35}
    max-context-chars: 6000
    dimensions: 1024  # must equal vector(n) in V1__init_schema.sql

logging:
  level:
    root: INFO
    com.ironoak: DEBUG
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false

logging:
  level:
    com.ironoak: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true  # never allow flyway clean against the real database

logging:
  level:
    com.ironoak: INFO
