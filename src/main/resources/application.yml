spring:
  application:
    name: iron-oak-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iron_oak_db}
    username: ${DB_USERNAME:ironman}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway owns the schema - Hibernate only validates it matches, never generates it.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${GPT_MODEL}
          temperature: 0.3
          max-tokens: 1024
      embedding:
        options:
          model: ${EMBEDDING_MODEL}
          dimensions: 1536

    vectorstore:
      milvus:
        client:
          uri: ${MILVUS_URI}
          token: ${MILVUS_TOKEN}
        collection-name: piper-vector-store
        embedding-dimension: 1536
        metric-type: COSINE
        initialize-schema: false

  security:
    filter:
      order: 10

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

# Health checks: only /actuator/health is exposed. Anyone gets UP/DOWN; staff (ROLE_ADMIN token)
# also see the components (database, disk, payments). /actuator/health/liveness and /readiness
# are for the process supervisor or load balancer; readiness includes the database.
springdoc:
  # Off unless a profile turns it on (local does); prod stays off, so the VPS publishes no docs.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui
    persist-authorization: true   # keep the pasted token across page reloads
    tags-sorter: alpha
    operations-sorter: alpha
    # open on the public group (must equal its displayName in OpenApiConfig); admin is in the top-right dropdown
    urls-primary-name: "Public (storefront, checkout)"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# CORS - Next.js frontend on Vercel
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-minutes: 15          # access token
    refresh-expiration-days: 7      # refresh token, renewed on every use
    refresh-max-session-days: 30    # absolute cap on one login session

  checkout:
    reservation-minutes: 360        # unpaid web orders hold their stock 6 h (must exceed session-minutes)
    session-minutes: 31             # how long the Stripe Checkout page stays open (Stripe minimum is 30)
    max-hold-minutes: 360           # a new payment attempt cannot extend the hold past this order age
    currency: USD
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  shipping:
    google-api-key: ${GOOGLE_ROUTES_API_KEY:} # Routes API; blank = never call Google (estimates only)
    google-daily-cap: 200                     # Google calls per UTC day, then estimates until tomorrow
    origin-address: ${SHIPPING_ORIGIN_ADDRESS:Bogota, Colombia}   # the warehouse address
    origin-location: ${SHIPPING_LOCATION:}    # warehouse "[lat, lon]"; preferred over the address when set
    quote-hold-hours: 72                      # stock hold while staff quote shipping (machines, unpriced air)
    piper-hold-minutes: 1440                  # stock hold for Piper orders, paid later by order number

  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  security:
    trust-forwarded-for: false      # true only behind a proxy that appends X-Forwarded-For
    login:
      max-failures-per-account-and-ip: 5
      max-failures-per-account: 30
      max-failures-per-ip: 20
      window-minutes: 15
      lockout-minutes: 15           # doubles on each repeated lockout
      max-lockout-minutes: 120
    rate-limit:
      login-per-minute: 10
      refresh-per-minute: 30
      public-write-per-minute: 30
      public-lookup-per-minute: 60

  vision:
    model-path: ${VISION_MODEL_PATH:classpath:models/hardware_store_mobilenetv3.onnx}
    confidence-threshold: ${VISION_CONFIDENCE_THRESHOLD:0.55}
    input-size: 224

logging:
  level:
    root: INFO
    com.ironoak: DEBUG
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.ironoak: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true  # never allow flyway clean against the real database

logging:
  level:
    com.ironoak: INFO
