spring:
  application:
    name: iron-oak-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iron_oak_db}
    username: ${DB_USERNAME:ironman}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway owns the schema - Hibernate only validates it matches, never generates it.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${GPT_MODEL}
          temperature: 0.3
          max-tokens: 1024
      embedding:
        options:
          model: ${EMBEDDING_MODEL}
          dimensions: 1536

    vectorstore:
      milvus:
        client:
          uri: ${MILVUS_URI}
          token: ${MILVUS_TOKEN}
        collection-name: piper-vector-store
        embedding-dimension: 1536
        metric-type: COSINE
        initialize-schema: false

  security:
    filter:
      order: 10

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

# CORS - Next.js frontend on Vercel
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-minutes: 120

  vision:
    model-path: ${VISION_MODEL_PATH:classpath:models/hardware_store_mobilenetv3.onnx}
    confidence-threshold: ${VISION_CONFIDENCE_THRESHOLD:0.55}
    input-size: 224

logging:
  level:
    root: INFO
    com.ironoak: DEBUG
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false

logging:
  level:
    com.ironoak: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true  # never allow flyway clean against the real database

logging:
  level:
    com.ironoak: INFO
